<script>
function initGoogleMap() {
    waitForMarkerClusterer();
}
function waitForMarkerClusterer() {
    if (typeof markerClusterer !== 'undefined' && typeof markerClusterer.MarkerClusterer !== 'undefined') {
        startMapLogic();
    } else {
        setTimeout(waitForMarkerClusterer, 100);
    }
}
function startMapLogic() {

    // Dil algılama - Joomla sayfasının diline göre
    const currentLang = document.documentElement.lang || 'tr';
    const isEnglish = currentLang.toLowerCase().startsWith('en');

    // Lejant çift dil desteği
    const legendLabels = {
        tr: {
            title: "Harita Lejantı",
            region: "Antik Bölge",
            city: "Antik Şehir",
            mint: "Darphane"
        },
        en: {
            title: "Map Legend",
            region: "Ancient Region",
            city: "Ancient City",
            mint: "Mint"
        }
    };

    // Lejant metinlerini güncelle
    const lang = isEnglish ? 'en' : 'tr';
    document.getElementById('legend-title').textContent = legendLabels[lang].title;
    document.getElementById('legend-region').textContent = legendLabels[lang].region;
    document.getElementById('legend-city').textContent = legendLabels[lang].city;
    document.getElementById('legend-mint').textContent = legendLabels[lang].mint;

    // Bölge Popup elementleri
    const regionPopup = document.getElementById('region-popup');
    const regionPopupTitle = document.getElementById('region-popup-title');
    const regionPopupSubtitle = document.getElementById('region-popup-subtitle');
    const regionPopupDesc = document.getElementById('region-popup-desc');
    const regionPopupLinks = document.getElementById('region-popup-links');
    const regionPopupClose = document.getElementById('region-popup-close');

    // Lejant toggle
    const legendToggle = document.getElementById('legend-toggle');
    const mapLegend = document.getElementById('map-legend');

    legendToggle.addEventListener('click', () => {
        mapLegend.classList.toggle('open');
    });

    // Popup kapat butonu
    regionPopupClose.addEventListener('click', () => {
        regionPopup.style.display = 'none';
    });

    // Bölge popup'ı göster fonksiyonu
    function showRegionPopup(region, x, y) {
        const title = isEnglish ? region.name : (region.name_tr || region.name);
        const subtitle = isEnglish ? (region.name_tr || '') : region.name;
        const desc = isEnglish ? (region.descEn || region.desc) : region.desc;
        const coinsLink = isEnglish ? (region.link_en || '') : (region.link_tr || '');
        const coinsLinkText = isEnglish ? 'View Coins' : 'Sikkeleri İncele';
        const detailLink = isEnglish ? (region.detail_en || '') : (region.detail_tr || '');
        const detailLinkText = isEnglish ? 'More Info' : 'Ayrıntılı Bilgi';

        regionPopupTitle.textContent = title;
        regionPopupSubtitle.textContent = subtitle !== title ? subtitle : '';
        regionPopupDesc.textContent = desc;

        // Linkleri oluştur
        let linksHtml = '';
        if (coinsLink) {
            linksHtml += '<a href="' + coinsLink + '">' + coinsLinkText + '</a>';
        }
        if (detailLink) {
            if (linksHtml) linksHtml += ' · ';
            linksHtml += '<a href="' + detailLink + '">' + detailLinkText + '</a>';
        }
        regionPopupLinks.innerHTML = linksHtml;

        // Popup pozisyonunu ayarla
        regionPopup.style.setProperty('left', x + 'px', 'important');
        regionPopup.style.setProperty('top', y + 'px', 'important');
        regionPopup.style.setProperty('display', 'block', 'important');
    }

    // DÜZELTME: Eksik olan hide() ve show() metodları eklendi.
    class MapLabel extends google.maps.OverlayView {
        constructor(position, text, className, onClickCallback) {
            super();
            this.position = position;
            this.div = document.createElement('div');
            this.div.className = 'map-static-label ' + className;
            this.div.textContent = text;
            this.isClickable = !!onClickCallback;

            if (this.isClickable) {
                this.div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    onClickCallback();
                });
            }
        }
        onAdd() {
            const panes = this.getPanes();
            if (this.isClickable) {
                panes.floatPane.appendChild(this.div); // Tıklanabilir etiketler en üstte
            } else {
                panes.overlayLayer.appendChild(this.div);
            }
        }
        onRemove() { if (this.div.parentElement) this.div.parentElement.removeChild(this.div); }
        draw() { const point = this.getProjection().fromLatLngToDivPixel(this.position); if (point) { this.div.style.left = point.x + 'px'; this.div.style.top = point.y + 'px'; } }

        // EKSİK OLAN FONKSİYONLAR
        hide() { this.div.classList.add('hidden'); }
        show() { this.div.classList.remove('hidden'); }
    }

    class CustomInfoWindow extends google.maps.OverlayView { /* ... Önceki kodla aynı ... */ }
    class OptimizedRenderer { /* ... Önceki kodla aynı ... */ }
    CustomInfoWindow = class extends google.maps.OverlayView { constructor() { super(); this.div = document.createElement('div'); this.div.className = 'custom-popup-window'; this.div.innerHTML = `<svg class="custom-popup-close-button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg><div class="custom-popup-content"><h3 id="popup-title-custom"></h3><p id="popup-content-custom"></p></div>`; this.contentTitle = this.div.querySelector('#popup-title-custom'); this.contentBody = this.div.querySelector('#popup-content-custom'); this.closeButton = this.div.querySelector('.custom-popup-close-button'); this.closeButton.onclick = () => { this.close(); }; } onAdd() { this.getPanes().floatPane.appendChild(this.div); } onRemove() { if (this.div.parentElement) this.div.parentElement.removeChild(this.div); } draw() { const pos = this.get('position'); if (pos && this.getProjection()) { const p = this.getProjection().fromLatLngToDivPixel(pos); this.div.style.left = p.x + 'px'; this.div.style.top = p.y + 'px'; } } open(map, marker) { this.set('position', marker.getPosition()); this.setMap(map); this.draw(); this.div.style.display = 'block'; } close() { this.setMap(null); this.div.style.display = 'none'; } setContent(title, content) { this.contentTitle.textContent = title; this.contentBody.textContent = content || ''; } };
    OptimizedRenderer = class { render({ count, position }, stats) { const iconBasePath = '/media/map-icons/'; let iconUrl = iconBasePath + 'cluster-s.png'; let size = 30; if (count > 100) { iconUrl = iconBasePath + 'cluster-l.png'; size = 44; } else if (count > 10) { iconUrl = iconBasePath + 'cluster-m.png'; size = 36; } return new google.maps.Marker({ position, icon: { url: iconUrl, scaledSize: new google.maps.Size(size, size), }, label: { text: String(count), color: '#FCF5ED', fontSize: '12px', fontWeight: 'bold', }, zIndex: 1000 + count, }); } };

    const mapStyle = [{"featureType":"all","elementType":"labels","stylers":[{"visibility":"off"}]},{"featureType":"landscape.natural","elementType":"geometry","stylers":[{"color":"#e7c8ae"}]},{"featureType":"landscape.natural.landcover","elementType":"geometry","stylers":[{"color":"#f3e0c5"}]},{"featureType":"water","elementType":"geometry","stylers":[{"color":"#d1ad6f"}]},{"featureType":"road","stylers":[{"visibility":"off"}]},{"featureType":"poi","stylers":[{"visibility":"off"}]},{"featureType":"administrative","stylers":[{"visibility":"off"}]},{"featureType":"transit","stylers":[{"visibility":"off"}]}];
    const mapOptions = { center: { lat: 39.0, lng: 35.0 }, zoom: 7, styles: mapStyle, mapTypeId: 'terrain', disableDefaultUI: true, zoomControl: true, gestureHandling: 'cooperative' };
    const map = new google.maps.Map(document.getElementById("google-antik-harita"), mapOptions);

    // Haritaya tıklandığında lejantı kapat
    map.addListener('click', () => {
        mapLegend.classList.remove('open');
    });

    const customInfoWindow = new CustomInfoWindow();
    const locationIcon = { path: google.maps.SymbolPath.CIRCLE, scale: 4.5, fillOpacity: 0, strokeColor: '#c0392b', strokeWeight: 1.5 };
    const mapClusterer = new markerClusterer.MarkerClusterer({ map, renderer: new OptimizedRenderer() });

    let activeRequestController = null;
    function updateMarkers() {
        const currentZoom = map.getZoom();
        if (currentZoom < 8) {
            mapClusterer.clearMarkers();
            return;
        }
        const bounds = map.getBounds();
        if (!bounds) return;
        if (activeRequestController) { activeRequestController.abort(); }
        activeRequestController = new AbortController();
        const signal = activeRequestController.signal;
        const ne = bounds.getNorthEast();
        const sw = bounds.getSouthWest();
        const url = `/get_points.php?zoom=${currentZoom}&ne_lat=${ne.lat()}&ne_lng=${ne.lng()}&sw_lat=${sw.lat()}&sw_lng=${sw.lng()}&lang=${isEnglish ? 'en' : 'tr'}`;

        fetch(url, { signal }).then(response => response.json()).then(responseJson => {
            if (responseJson.error) { throw new Error(`Sunucu taraflı hata: ${responseJson.error}`); }
            const data = responseJson.data;
            mapClusterer.clearMarkers();
            const newMarkers = data.map(point => {
                const position = { lat: point[0], lng: point[1] };
                const name = point[2];
                const desc = point[3];
                const marker = new google.maps.Marker({ position, icon: locationIcon, zIndex: 1 });
                marker.addListener('click', function(e) { e.domEvent.stopPropagation(); mapClusterer.markers.forEach(m => m.setZIndex(1)); this.setZIndex(100); customInfoWindow.setContent(name, desc); customInfoWindow.open(map, this); });
                return marker;
            });
            mapClusterer.addMarkers(newMarkers);
        }).catch(error => { if (error.name !== 'AbortError') { console.error("Markerlar güncellenirken hata:", error); } }).finally(() => { activeRequestController = null; });
    }
    google.maps.event.addListener(map, 'idle', updateMarkers);

    // 16 Ana Antik Anadolu Bölgesi - Çift Dil Desteği (TR/EN)
    const anatolianRegions = [
        { name: "LYDIA", name_tr: "LİDYA", lat: 38.6, lng: 28.2, desc: "Paranın icat edildiği bölge, Croesus'un krallığı", descEn: "Birthplace of coinage, Kingdom of Croesus", link_tr: "/tr/lidya-sikkeleri", link_en: "/en/lydia-coins" },
        { name: "IONIA", name_tr: "İYONYA", lat: 37.9, lng: 27.3, desc: "Antik felsefe ve bilimin beşiği", descEn: "Cradle of ancient philosophy and science", link_tr: "/tr/ionya-sikkeleri", link_en: "/en/ionia-coins" },
        { name: "CARIA", name_tr: "KARYA", lat: 37.5, lng: 28.3, desc: "Mausoleum ve Halikarnassos'un bölgesi", descEn: "Region of the Mausoleum and Halicarnassus", link_tr: "/tr/karya-sikkeleri", link_en: "/en/caria-coins" },
        { name: "LYCIA", name_tr: "LİKYA", lat: 36.6, lng: 29.8, desc: "Dünyanın ilk demokratik federasyonu", descEn: "World's first democratic federation", link_tr: "/tr/likya-sikkeleri", link_en: "/en/lycia-coins" },
        { name: "PHRYGIA", name_tr: "FRİGYA", lat: 38.8, lng: 30.5, desc: "Kral Midas ve Gordion'un toprakları", descEn: "Lands of King Midas and Gordion", link_tr: "/tr/frigya-sikkeleri", link_en: "/en/phrygia-coins" },
        { name: "CILICIA", name_tr: "KİLİKYA", lat: 37.0, lng: 35.5, desc: "Tarsus ve Aziz Paulus'un memleketi", descEn: "Tarsus and homeland of Saint Paul", link_tr: "/tr/kilikya-sikkeleri", link_en: "/en/cilicia-coins" },
        { name: "PAMPHYLIA", name_tr: "PAMFİLYA", lat: 37.0, lng: 31.0, desc: "Aspendos ve Side'nin bölgesi", descEn: "Region of Aspendos and Side", link_tr: "/tr/pamfilya-sikkeleri", link_en: "/en/pamphylia-coins" },
        { name: "MYSIA", name_tr: "MİSYA", lat: 39.9, lng: 27.9, desc: "Pergamon ve Helenistik kültürün merkezi", descEn: "Pergamon and center of Hellenistic culture", link_tr: "/tr/misya-sikkeleri", link_en: "/en/mysia-coins" },
        { name: "PISIDIA", name_tr: "PİSİDYA", lat: 37.7, lng: 30.5, desc: "Dağlık bölge, Sagalassos ve Termessos", descEn: "Mountainous region, Sagalassos and Termessos", link_tr: "/tr/pisidya-sikkeleri", link_en: "/en/pisidia-coins" },
        { name: "BITHYNIA", name_tr: "BİTİNYA", lat: 40.5, lng: 31.0, desc: "Nikomedia ve İznik Konsili'nin bölgesi", descEn: "Nicomedia and region of the Nicaean Council", link_tr: "/tr/bitinya-sikkeleri", link_en: "/en/bithynia-coins" },
        { name: "CAPPADOCIA", name_tr: "KAPADOKYA", lat: 38.6, lng: 35.5, desc: "Peri bacaları ve yeraltı şehirleri", descEn: "Fairy chimneys and underground cities", link_tr: "/tr/kapadokya-sikkeleri", link_en: "/en/cappadocia-coins" },
        { name: "GALATIA", name_tr: "GALATYA", lat: 39.9, lng: 32.8, desc: "Kelt kökenli Galatların yurdu, Ankara", descEn: "Homeland of Celtic Galatians, Ankara", link_tr: "/tr/galatya-sikkeleri", link_en: "/en/galatia-coins" },
        { name: "TROAS", name_tr: "TROAS", lat: 39.8, lng: 26.5, desc: "Efsanevi Truva Savaşı'nın yeri", descEn: "Site of the legendary Trojan War", link_tr: "/tr/troas-sikkeleri", link_en: "/en/troas-coins" },
        { name: "AEOLIS", name_tr: "AİOLİS", lat: 39.2, lng: 27.0, desc: "Aiol Yunanlılarının kolonileri", descEn: "Colonies of the Aeolian Greeks", link_tr: "/tr/aiolis-sikkeleri", link_en: "/en/aeolis-coins" },
        { name: "PONTUS", name_tr: "PONTUS", lat: 40.8, lng: 37.5, desc: "Karadeniz kıyısı, Mithridates'in krallığı", descEn: "Black Sea coast, Kingdom of Mithridates", link_tr: "/tr/pontus-sikkeleri", link_en: "/en/pontus-coins" },
        { name: "PAPHLAGONIA", name_tr: "PAFLAGONYA", lat: 41.5, lng: 34.0, desc: "Sinop ve Karadeniz limanları", descEn: "Sinope and Black Sea ports", link_tr: "/tr/paflagonya-sikkeleri", link_en: "/en/paphlagonia-coins" }
    ];

    // 4 Alt Bölge (Diğer Bölgeler kategorisi) - Daha küçük font

        { name: "Kyme", lat: 38.760, lng: 26.938, desc: "Aiolis'in en büyük ve önemli kenti", descEn: "Largest and most important city of Aeolis" },
        { name: "Elaia", lat: 38.943, lng: 27.037, desc: "Pergamon'un liman kenti", descEn: "Port city of Pergamon" },
        { name: "Temnos", lat: 38.817, lng: 27.183, desc: "Gediz vadisinde Aiol kenti", descEn: "Aeolian city in Gediz valley" },
        { name: "Aigai", lat: 38.883, lng: 27.100, desc: "Aiol Birliği'nin 12 kentinden biri", descEn: "One of 12 cities of Aeolian League" },
        { name: "Myrina", lat: 38.950, lng: 27.050, desc: "Aliağa yakınlarında Aiol liman kenti", descEn: "Aeolian port city near Aliaga" },
        { name: "Grynion", lat: 38.900, lng: 27.017, desc: "Apollon tapınağı ile ünlü Aiol kenti", descEn: "Aeolian city famous for Temple of Apollo" }
    ];

    // Dile göre açıklama seç
    function getDescription(item) {
        return isEnglish ? (item.descEn || item.desc) : item.desc;
    }

    // Dile göre bölge adı seç
    function getRegionName(item) {
        return isEnglish ? item.name : (item.name_tr || item.name);
    }

    // Popup için zoom eşiği (bu seviye ve üstünde popup açılır, altında zoom yapılır)
    const POPUP_ZOOM_THRESHOLD = 8;

    // 16 Ana Bölge Etiketleri - Düşük zoom'da yakınlaş, yüksek zoom'da popup göster
    const regionLabels = anatolianRegions.map(region => {
        const onClickCallback = () => {
            const currentZoom = map.getZoom();
            console.log('Region clicked:', region.name, 'Zoom:', currentZoom, 'Threshold:', POPUP_ZOOM_THRESHOLD);

            // Düşük zoom seviyesinde: bölgeye yakınlaş
            if (currentZoom < POPUP_ZOOM_THRESHOLD) {
                map.setCenter(new google.maps.LatLng(region.lat, region.lng));
                map.setZoom(currentZoom + 2); // 2 seviye yakınlaş
                return;
            }

            // Yüksek zoom seviyesinde: popup göster
            console.log('Showing popup for:', region.name);
            const mapContainer = document.getElementById('google-antik-harita');
            const projection = map.getProjection();
            const bounds = map.getBounds();
            const ne = bounds.getNorthEast();
            const sw = bounds.getSouthWest();

            const latLng = new google.maps.LatLng(region.lat, region.lng);
            const point = projection.fromLatLngToPoint(latLng);
            const nePoint = projection.fromLatLngToPoint(ne);
            const swPoint = projection.fromLatLngToPoint(sw);

            const scale = mapContainer.offsetWidth / (nePoint.x - swPoint.x);
            const x = (point.x - swPoint.x) * scale;
            const y = (point.y - nePoint.y) * scale;
            console.log('Popup position:', x, y);

            showRegionPopup(region, x, y);
        };
        return new MapLabel(new google.maps.LatLng(region.lat, region.lng), getRegionName(region), 'map-region-label', onClickCallback);
    });

    // 4 Alt Bölge Etiketleri (Diğer Bölgeler) - Aynı mantık: düşük zoom'da yakınlaş, yüksek zoom'da popup
    const subRegionLabels = subRegions.map(region => {
        const onClickCallback = (e) => {
            const currentZoom = map.getZoom();

            // Düşük zoom seviyesinde: bölgeye yakınlaş
            if (currentZoom < POPUP_ZOOM_THRESHOLD) {
                map.setCenter(new google.maps.LatLng(region.lat, region.lng));
                map.setZoom(currentZoom + 2);
                return;
            }

            // Yüksek zoom seviyesinde: popup göster
            const mapContainer = document.getElementById('google-antik-harita');
            const projection = map.getProjection();
            const bounds = map.getBounds();
            const ne = bounds.getNorthEast();
            const sw = bounds.getSouthWest();

            const latLng = new google.maps.LatLng(region.lat, region.lng);
            const point = projection.fromLatLngToPoint(latLng);
            const nePoint = projection.fromLatLngToPoint(ne);
            const swPoint = projection.fromLatLngToPoint(sw);

            const scale = mapContainer.offsetWidth / (nePoint.x - swPoint.x);
            const x = (point.x - swPoint.x) * scale;
            const y = (point.y - nePoint.y) * scale;

            showRegionPopup(region, x, y);
        };
        return new MapLabel(new google.maps.LatLng(region.lat, region.lng), getRegionName(region), 'map-subregion-label', onClickCallback);
    });

    // Şehir Etiketleri
    const cityLabels = majorCities.map(city => {
        return new MapLabel(new google.maps.LatLng(city.lat, city.lng), city.name, 'map-city-label', null);
    });

    // Tüm etiketleri haritaya ekle
    const allLabels = [...regionLabels, ...subRegionLabels, ...cityLabels];
    allLabels.forEach(label => label.setMap(map));

    // ZOOM BAZLI HİYERARŞİK GÖSTER/GİZLE MANTIĞI
    // Zoom 5-6: Sadece 16 ana bölge
    // Zoom 7: Ana bölgeler + 4 alt bölge
    // Zoom 8+: Tüm etiketler (bölgeler + şehirler)
    function toggleStaticLabels() {
        const currentZoom = map.getZoom();

        // Her zaman 16 ana bölge görünür
        regionLabels.forEach(label => label.show());

        // Zoom 7+: Alt bölgeler görünür
        if (currentZoom >= 7) {
            subRegionLabels.forEach(label => label.show());
        } else {
            subRegionLabels.forEach(label => label.hide());
        }

        // Zoom 8+: Şehirler görünür
        if (currentZoom >= 8) {
            cityLabels.forEach(label => label.show());
        } else {
            cityLabels.forEach(label => label.hide());
        }
    }
    google.maps.event.addListener(map, 'zoom_changed', toggleStaticLabels);
    toggleStaticLabels();

    // Haritaya tıklandığında popup'ları kapat
    map.addListener('click', function() {
        customInfoWindow.close();
        regionPopup.style.display = 'none';
    });

    // Harita hareket ettiğinde veya zoom değiştiğinde bölge popup'ını gizle
    map.addListener('dragstart', function() {
        regionPopup.style.display = 'none';
    });
    map.addListener('zoom_changed', function() {
        regionPopup.style.display = 'none';
    });
}
</script>
