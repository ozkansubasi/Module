<style>
    /* Haritanın kendisi için genel stil */
    #single-mint-map {
        width: 100%;
        height: 400px;
        position: relative;
        overflow: hidden;
        border-radius: 8px;
    }
    /* Bizim özel popup penceremiz */
    .custom-popup-window {
        position: absolute;
        background: #FCF5ED;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        min-width: 200px;
        max-width: 300px;
        font-family: sans-serif;
        display: none;
        transform: translate(-50%, calc(-100% - 15px));
        z-index: 1000;
    }
    .custom-popup-window::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 10px solid #FCF5ED;
    }
    .custom-popup-close-button {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 20px;
        height: 20px;
        cursor: pointer;
        opacity: 0.7;
    }
    .custom-popup-close-button:hover { opacity: 1; }
    .custom-popup-content h3 { margin: 0 0 8px 0; font-size: 16px; color: #333; }
    .custom-popup-content p { margin: 0; font-size: 13px; line-height: 1.4; color: #555; }
</style>
